<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 京都 2泊3日</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b263e;
            --primary-dark: #6b1d2f;
            --primary-light: #fcf4f5;
            --accent: #d4a373;
            --text-dark: #2c2c2c;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --border-color: #e6dfdc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif, 'Noto Serif JP', serif;
            background: linear-gradient(135deg, #fcfbfa 0%, #f7f1ee 100%);
            color: var(--text-dark);
            line-height: 1.7;
            font-size: 1rem;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #leaves-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        #leaves-container.off { opacity: 0; }

        .leaf {
            position: absolute;
            top: -10vh;
            background: linear-gradient(135deg, #d9534f, #c0392b, #e67e22);
            opacity: 0.8;
            border-radius: 15% 85% 30% 70% / 50% 30% 70% 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg); }
            100% { transform: translateY(110vh) translateX(-50px) rotate(360deg); opacity: 0.2; }
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(139, 38, 62, 0.12);
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 2;
        }

        header {
            background: linear-gradient(135deg, #42101b 0%, var(--primary) 50%, #b3435c 100%);
            color: white;
            text-align: center;
            padding: 45px 20px 55px;
            position: relative;
        }

        header h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 0.08em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            word-break: break-all;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.95;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        .dashboard-widgets {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .countdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0 5px;
        }

        .cd-edit-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cd-edit-btn:hover { background: rgba(255,255,255,0.4); }

        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .countdown-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 10px;
            border-radius: 10px;
            min-width: 55px;
            text-align: center;
        }
        .countdown-item span { display: block; font-size: 1.15rem; }

        .utility-bar {
            background: #fff8f6;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .utility-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .util-btn {
            background: white;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .util-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--primary);
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #e8cdd1;
            cursor: pointer;
        }

        .toggle-switch input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }

        .hotel-banner {
            background: linear-gradient(135deg, #fcf4f5, #fff5f0);
            border-left: 6px solid var(--primary);
            padding: 16px 20px;
            margin: 20px;
            border-radius: 12px;
            font-size: 1rem;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hotel-banner a { color: var(--primary); font-weight: 700; text-decoration: none; border-bottom: 1.5px dashed var(--primary); }

        .tab-nav {
            display: flex;
            justify-content: center;
            background-color: transparent;
            padding: 15px 15px 10px;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 22px;
            border-radius: 35px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 38, 62, 0.08);
        }

        .tab-btn:hover { background: var(--primary-light); transform: translateY(-2px); }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 8px 20px rgba(139, 38, 62, 0.3);
            border-color: var(--primary-dark);
        }

        .day-content {
            display: none;
            padding: 20px;
            animation: fadeIn 0.4s ease forwards;
        }

        .day-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-header-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .add-schedule-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-schedule-btn:hover { background: var(--primary-dark); }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 10px;
            bottom: 10px;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--accent), var(--primary-light));
            border-radius: 4px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
            background: #faf8f7;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #f0eae6;
            transition: all 0.3s;
        }

        .timeline-item.completed {
            background: #f2f9f2;
            border-color: #c8e6c9;
            opacity: 0.85;
        }

        .timeline-dot {
            position: absolute;
            left: -30px;
            top: 22px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: white;
            border: 4px solid var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
            transition: background 0.3s;
        }
        .timeline-item.completed .timeline-dot {
            background-color: #2e7d32;
            border-color: #2e7d32;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-input {
            background: var(--primary-light);
            color: var(--primary);
            border: 1.5px solid #e8cdd1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            width: 110px;
            text-align: center;
            outline: none;
        }

        .right-header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .reservation-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #666;
            background: white;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #e0d8d5;
            cursor: pointer;
            user-select: none;
        }
        .reservation-box input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        .reservation-box.checked { background: #edf7ed; color: #2e7d32; border-color: #c8e6c9; }

        .done-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #555;
            background: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .done-box input { width: 16px; height: 16px; accent-color: #2e7d32; cursor: pointer; }
        .done-box.checked { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }

        .title-input {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            font-family: 'Noto Serif JP', serif;
            font-size: 1.25rem;
            color: #222;
            font-weight: 700;
            margin-bottom: 6px;
            outline: none;
            transition: all 0.2s;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .timeline-item.completed .title-input { text-decoration: line-through; color: #666; }
        .title-input:focus {
            background: white;
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* URL入力＆表示エリア用のCSS */
        .url-input {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.9rem;
            color: #555;
        }
        .url-input:focus {
            background: white;
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .url-preview-wrap {
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            background: #fff;
        }
        .url-preview-btn {
            display: block;
            background: var(--primary-light);
            color: var(--primary);
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
        }
        .url-preview-btn:hover {
            background: #f5e4e7;
        }
        .site-iframe {
            width: 100%;
            height: 250px;
            border: none;
            display: block;
        }

        .item-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
        }

        .delete-item-btn {
            background: transparent;
            border: none;
            color: #999;
            font-size: 0.88rem;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-item-btn:hover { color: #d9534f; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal.show { display: flex; animation: modalPop 0.3s ease; }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            font-family: 'Noto Serif JP', serif;
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1.4rem;
        }

        .checklist-row, .budget-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .checklist-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
        .checklist-row input[type="text"], .budget-row input[type="text"], .budget-row input[type="number"] {
            flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none;
        }
        .budget-row input[type="text"] { flex: 2; }
        .budget-row input[type="number"] { text-align: right; }
        .delete-btn { background: #eee; border: none; color: #666; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .delete-btn:hover { background: #d9534f; color: white; }

        .add-item-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px dashed var(--primary);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .add-item-btn:hover { background: var(--primary); color: white; }

        .budget-total {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 2px dashed #eee;
            font-weight: 700;
            font-size: 1.2rem;
            text-align: right;
            color: var(--primary);
        }

        .memo-textarea, .share-textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            resize: vertical;
        }
        .share-textarea { background: #f9f9f9; font-family: monospace; height: 250px; font-size: 0.9rem; }

        .close-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 20px;
            float: right;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
            color: #aaa;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            margin-top: 40px;
            border-radius: 0 0 24px 24px;
        }

        @media (max-width: 600px) {
            .container { margin: 10px; border-radius: 16px; width: calc(100% - 20px); }
            header { padding: 35px 15px 45px; }
            header h1 { font-size: 1.5rem; }
            .day-content { padding: 15px 10px; }
            .utility-bar { padding: 12px 15px; }
            .tab-btn { padding: 8px 16px; font-size: 0.9rem; }
            .timeline { padding-left: 25px; }
            .timeline-item { padding: 14px; }
        }
    </style>
</head>
<body>

<div id="leaves-container"></div>

<!-- モーダル群 -->
<div id="cd-modal" class="modal">
    <div class="modal-content">
        <h3>⏳ 出発日時の設定</h3>
        <input type="datetime-local" id="cd-target-input" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px;">
        <button class="util-btn" style="width: 100%; padding: 10px;" onclick="saveCountdownTarget()">設定を保存する</button>
        <br style="clear: both;"><button class="close-btn" onclick="toggleModal('cd-modal', false)">閉じる</button>
    </div>
</div>

<div id="checklist-modal" class="modal">
    <div class="modal-content">
        <h3>🎒 持ち物・準備リスト</h3>
        <div id="checklist-container"></div>
        <button class="add-item-btn" onclick="addChecklistItem()">＋ 項目を追加する</button>
        <br style="clear: both;"><button class="close-btn" onclick="toggleModal('checklist-modal', false)">閉じる</button>
    </div>
</div>

<div id="budget-modal" class="modal">
    <div class="modal-content">
        <h3>💰 旅の予算・費用計算</h3>
        <div id="budget-container"></div>
        <button class="add-item-btn" onclick="addBudgetRow()">＋ 費目を追加する</button>
        <div class="budget-total" id="budget-total-display">合計: 0円</div>
        <br style="clear: both;"><button class="close-btn" onclick="toggleModal('budget-modal', false)">閉じる</button>
    </div>
</div>

<div id="memo-modal" class="modal">
    <div class="modal-content">
        <h3>📝 フリーメモ・URL</h3>
        <textarea id="free-memo" class="memo-textarea" placeholder="ここに自由にメモを入力..." oninput="saveMemo()"></textarea>
        <br style="clear: both;"><button class="close-btn" onclick="toggleModal('memo-modal', false)">閉じる</button>
    </div>
</div>

<div id="share-modal" class="modal">
    <div class="modal-content">
        <h3>📤 しおりをテキストで共有</h3>
        <textarea id="share-text" class="share-textarea" readonly></textarea>
        <button class="util-btn" style="margin-top: 15px; width: 100%; padding: 10px;" onclick="copyShareText()">📋 テキストをコピーする</button>
        <br style="clear: both;"><button class="close-btn" onclick="toggleModal('share-modal', false)">閉じる</button>
    </div>
</div>

<div class="container">
    <header>
        <h1>🍁 京都 2泊3日</h1>
       
        
        <div class="dashboard-widgets">
            <div class="countdown-header">
                <span>⏳ 出発まであと</span>
                <button class="cd-edit-btn" onclick="openCountdownModal()">日時を変更</button>
            </div>
            <div class="countdown-box" id="countdown-display">
                <div class="countdown-item"><span id="cd-days">00</span>日</div>
                <div class="countdown-item"><span id="cd-hours">00</span>時間</div>
                <div class="countdown-item"><span id="cd-mins">00</span>分</div>
                <div class="countdown-item"><span id="cd-secs">00</span>秒</div>
            </div>
        </div>
    </header>

    <div class="utility-bar">
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">✨ 変更や入力は自動保存されます</span>
        <div class="utility-buttons">
            <label class="toggle-switch">
                <input type="checkbox" id="leaf-toggle" checked onchange="toggleLeaves(this)"> 🍁 落ち葉
            </label>
            <button class="util-btn" onclick="toggleModal('checklist-modal', true)">🎒 持ち物</button>
            <button class="util-btn" onclick="toggleModal('budget-modal', true)">💰 予算</button>
            <button class="util-btn" onclick="toggleModal('memo-modal', true)">📝 メモ</button>
            <button class="util-btn" onclick="openShareModal()">📤 共有</button>
            <button class="util-btn" onclick="resetData()">🔄 リセット</button>
        </div>
    </div>

    <div class="hotel-banner">
        <div><span>🏨</span> <strong>宿泊先：</strong> リーガロイヤルホテル京都（京都駅八条口から無料シャトルバス または徒歩約7分）</div>
        <a href="https://www.rihga.co.jp/kyoto" target="_blank">公式サイト ↗</a>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchDay(1)">Day 1</button>
        <button class="tab-btn" onclick="switchDay(2)">Day 2</button>
        <button class="tab-btn" onclick="switchDay(3)">Day 3</button>
    </div>

    <div id="day1" class="day-content active">
        <div class="day-header-title">
            <span>🍂 Day 1：到着・水族館・東寺ライトアップ</span>
            <button class="add-schedule-btn" onclick="addScheduleItem(1)">＋ 予定を追加</button>
        </div>
        <div class="timeline" id="timeline-1"></div>
    </div>

    <div id="day2" class="day-content">
        <div class="day-header-title">
            <span>✨ Day 2：東福寺・和菓子作り・チームラボ</span>
            <button class="add-schedule-btn" onclick="addScheduleItem(2)">＋ 予定を追加</button>
        </div>
        <div class="timeline" id="timeline-2"></div>
    </div>

    <div id="day3" class="day-content">
        <div class="day-header-title">
            <span>🍁 Day 3：永観堂</span>
            <button class="add-schedule-btn" onclick="addScheduleItem(3)">＋ 予定を追加</button>
        </div>
        <div class="timeline" id="timeline-3"></div>
    </div>

    <footer>
        <p>✨ made by box ✨</p>
    </footer>
</div>

<script>
    // データ構造を更新（descを廃止し、url項目に変更。初期値は全て空文字）
    let tripData = {
        leavesOn: true,
        targetDate: '2026-11-20T09:00:00',
        days: {
            1: [
                { id: 'd1_1', time: '12:30', title: '京都到着', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd1_2', time: '13:30', title: '京都水族館', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd1_3', time: '16:00', title: '世界遺産「東寺」', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd1_4', time: '18:30', title: '京都駅', url: '', hasReservation: true, reserved: false, completed: false }
            ],
            2: [
                { id: 'd2_1', time: '09:00', title: '東福寺（通天橋）', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd2_2', time: '11:30', title: '京都タワー', url: '', hasReservation: true, reserved: false, completed: false },
                { id: 'd2_3', time: '13:00', title: '七條甘春堂 和菓子手作り体験', url: '', hasReservation: true, reserved: false, completed: false },
                { id: 'd2_4', time: '15:00', title: 'お昼ご飯', url: '', hasReservation: false, completed: false },
                { id: 'd2_5', time: '18:00', title: 'チームラボで', url: '', hasReservation: true, reserved: false, completed: false },
                { id: 'd2_6', time: '20:30', title: '祇園・駅周辺で夜ご飯', url: '', hasReservation: true, reserved: false, completed: false }
            ],
            3: [
                { id: 'd3_1', time: '09:00', title: 'ホテルチェックアウト', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd3_2', time: '09:30', title: '永観堂 禅林寺', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd3_3', time: '12:00', title: '京都駅', url: '', hasReservation: false, reserved: false, completed: false },
                { id: 'd3_4', time: '14:30', title: 'ホテルで荷物を受け取り、帰路へ', url: '', hasReservation: false, reserved: false, completed: false }
            ]
        },
        checklist: [],
        budget: [],
        memo: ''
    };

    function updateCountdown() {
        const targetTime = new Date(tripData.targetDate).getTime();
        const now = new Date().getTime();
        const diff = targetTime - now;
        if (diff <= 0) {
            document.getElementById('countdown-display').innerHTML = "<span>✨ 旅行当日です！最高の思い出を！ ✨</span>";
            return;
        }
        document.getElementById('cd-days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
        document.getElementById('cd-hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
        document.getElementById('cd-mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        document.getElementById('cd-secs').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);

    function openCountdownModal() {
        const currentTarget = tripData.targetDate || '2026-11-20T09:00:00';
        document.getElementById('cd-target-input').value = currentTarget.slice(0, 16);
        toggleModal('cd-modal', true);
    }

    function saveCountdownTarget() {
        const val = document.getElementById('cd-target-input').value;
        if (val) {
            tripData.targetDate = val + ':00';
            saveData();
            updateCountdown();
            toggleModal('cd-modal', false);
        }
    }

    function switchDay(dayNum) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.day-content').forEach(content => content.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('day' + dayNum).classList.add('active');
        window.scrollTo({ top: 250, behavior: 'smooth' });
    }

    function toggleModal(modalId, show) {
        document.getElementById(modalId).classList.toggle('show', show);
    }

    function renderAll() {
        for (let day = 1; day <= 3; day++) renderTimeline(day);
        renderChecklist();
        renderBudget();
        document.getElementById('free-memo').value = tripData.memo || '';
        updateCountdown();
    }

    function renderTimeline(day) {
        const container = document.getElementById('timeline-' + day);
        container.innerHTML = '';
        tripData.days[day].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'timeline-item ' + (item.completed ? 'completed' : '');
            
            // URLが存在し、httpから始まる場合のみiframeとリンクを表示
            let urlPreviewHtml = '';
            if (item.url && item.url.startsWith('http')) {
                urlPreviewHtml = `
                    <div class="url-preview-wrap">
                        <a href="${item.url}" target="_blank" class="url-preview-btn">🔗 サイトを別タブで開く ↗</a>
                        <iframe src="${item.url}" class="site-iframe" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="item-header">
                    <input type="text" class="time-input" value="${item.time}" onchange="updateItem(${day}, ${index}, 'time', this.value)">
                    <div class="right-header-controls">
                        ${item.hasReservation ? `
                            <label class="reservation-box ${item.reserved ? 'checked' : ''}">
                                <input type="checkbox" ${item.reserved ? 'checked' : ''} onchange="updateItem(${day},${index}, 'reserved', this.checked); renderAll();"> 予約済
                            </label>
                        ` : ''}
                        <label class="done-box ${item.completed ? 'checked' : ''}">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="updateItem(${day}, ${index}, 'completed', this.checked); renderAll();"> 完了
                        </label>
                    </div>
                </div>
                <input type="text" class="title-input" value="${item.title}" placeholder="タイトル..." onchange="updateItem(${day}, ${index}, 'title', this.value)">
                
                <!-- 変更箇所：詳細テキストを廃止しURL入力欄とプレビューに変更 -->
                <input type="url" class="url-input" value="${item.url || ''}" placeholder="🌐 お店のURLなどを貼り付け (Enterで表示)" onchange="updateItem(${day}, ${index}, 'url', this.value); renderTimeline(${day});">
                ${urlPreviewHtml}
                
                <div class="item-actions">
                    <button class="delete-item-btn" onclick="deleteScheduleItem(${day}, ${index})">削除</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function updateItem(day, index, field, value) {
        tripData.days[day][index][field] = value;
        saveData();
    }

    function addScheduleItem(day) {
        tripData.days[day].push({ id: 'custom_' + Date.now(), time: '12:00', title: '新しい予定', url: '', hasReservation: true, reserved: false, completed: false });
        renderTimeline(day);
        saveData();
    }

    function deleteScheduleItem(day, index) {
        if(confirm('この予定を削除しますか？')) {
            tripData.days[day].splice(index, 1);
            renderTimeline(day);
            saveData();
        }
    }

    function renderChecklist() {
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';
        tripData.checklist.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'checklist-row';
            row.innerHTML = `<input type="checkbox" ${item.checked ? 'checked' : ''} onchange="tripData.checklist[${index}].checked = this.checked; saveData();"><input type="text" value="${item.text}" placeholder="持ち物名..." oninput="tripData.checklist[${index}].text = this.value; saveData();"><button class="delete-btn" onclick="tripData.checklist.splice(${index}, 1); renderChecklist(); saveData();">×</button>`;
            container.appendChild(row);
        });
    }

    function addChecklistItem() {
        tripData.checklist.push({ text: '', checked: false });
        renderChecklist();
        saveData();
    }

    function renderBudget() {
        const container = document.getElementById('budget-container');
        container.innerHTML = '';
        let total = 0;
        tripData.budget.forEach((item, index) => {
            total += Number(item.amount) || 0;
            const row = document.createElement('div');
            row.className = 'budget-row';
            row.innerHTML = `<input type="text" value="${item.name}" placeholder="費目名..." oninput="tripData.budget[${index}].name = this.value; saveData();"><input type="number" value="${item.amount}" placeholder="金額" oninput="tripData.budget[${index}].amount = Number(this.value); renderBudget(); saveData();"><button class="delete-btn" onclick="tripData.budget.splice(${index}, 1); renderBudget(); saveData();">×</button>`;
            container.appendChild(row);
        });
        document.getElementById('budget-total-display').innerText = '合計: ' + total.toLocaleString() + '円';
    }

    function addBudgetRow() {
        tripData.budget.push({ name: '', amount: 0 });
        renderBudget();
        saveData();
    }

    function saveMemo() { tripData.memo = document.getElementById('free-memo').value; saveData(); }

    function openShareModal() {
        let text = "🍁 京都 2泊3日 紅葉ロマンチックデート旅 🍁\n\n";
        for (let day = 1; day <= 3; day++) {
            text += `【 Day ${day} 】\n`;
            tripData.days[day].forEach(item => {
                text += `[${item.time}] ${item.title} ${item.completed ? '✅' : ''}\n`;
                if(item.url) text += `URL: ${item.url}\n`;
            });
            text += "\n";
        }
        if(tripData.memo) text += `【メモ】\n${tripData.memo}\n`;
        document.getElementById('share-text').value = text;
        toggleModal('share-modal', true);
    }

    function copyShareText() {
        const textarea = document.getElementById('share-text');
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(() => alert('しおりのテキストをコピーしました！'));
    }

    function toggleLeaves(checkbox) {
        tripData.leavesOn = checkbox.checked;
        document.getElementById('leaves-container').classList.toggle('off', !checkbox.checked);
        saveData();
    }

    function saveData() { localStorage.setItem('kyoto_trip_pro_data_url_v1', JSON.stringify(tripData)); }

    function loadData() {
        const saved = localStorage.getItem('kyoto_trip_pro_data_url_v1');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.days) tripData = parsed;
            } catch(e) { console.error(e); }
        }
        document.getElementById('leaf-toggle').checked = tripData.leavesOn;
        document.getElementById('leaves-container').classList.toggle('off', !tripData.leavesOn);
        renderAll();
    }

    function resetData() {
        if(confirm('すべての変更やカスタム予定をリセットしますか？')) {
            localStorage.removeItem('kyoto_trip_pro_data_url_v1');
            location.reload();
        }
    }

    loadData();

    const leavesContainer = document.getElementById('leaves-container');
    for (let i = 0; i < 25; i++) {
        const leaf = document.createElement('div');
        leaf.classList.add('leaf');
        const size = Math.random() * 14 + 10;
        leaf.style.width = `${size}px`;
        leaf.style.height = `${size * 1.3}px`;
        leaf.style.left = `${Math.random() * 100}vw`;
        leaf.style.animationDuration = `${Math.random() * 6 + 5}s`;
        leaf.style.animationDelay = `${Math.random() * 5}s`;
        leavesContainer.appendChild(leaf);
    }
</script>

</body>
</html>
